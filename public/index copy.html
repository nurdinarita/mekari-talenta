<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mekari Talenta - Payroll Disbursement</title>
    <link rel="stylesheet" href="assets/css/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="hero-container">
      <!-- Header -->
      <header class="header">
        <img
          src="assets/images/logo-mekari-talenta.svg"
          alt="Logo Mekari Talenta"
          class="logo-img"
        />
      </header>

      <!-- Konten -->
      <main class="main-content">
        <div class="left-section">
          <h1 class="title">Payroll disbursement</h1>
          <button class="btn-payroll" id="runPayrollBtn">Run payroll</button>
        </div>

        <div class="right-section">
          <div class="hero-image">
            <img src="assets/images/hero.png" alt="Hero" />
          </div>
        </div>
      </main>

      <!-- Footer -->
      <footer class="footer">
        <a href="#" class="footer-link">
          <img
            src="assets/images/arrow-right.svg"
            alt="Arrow Right"
            class="footer-icon"
          />
          Payroll Service
        </a>
      </footer>
    </div>

    <!-- JavaScript -->
    <script src="assets/js/main.js"></script>
  </body>
</html>
