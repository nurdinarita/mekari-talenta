<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payroll Service - Mekari Talenta</title>
    <link rel="stylesheet" href="assets/css/payroll-service-2.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="hero-container">
      <!-- Header / Logo & Navigasi Home -->
      <header class="header">
        <div class="logo">
          <!-- <img
            src="assets/images/logo.png"
            alt="Mekari Talenta"
            class="logo-img"
          /> -->
        </div>
        <button class="home-btn" id="homeBtn" aria-label="Kembali ke Home">
          <img src="assets/images/payroll-service/home.png" alt="Home" />
        </button>
      </header>

      <button
        class="nav-arrow prev-arrow"
        id="prevBtn"
        title="Slide Sebelumnya"
      >
        <img
          src="assets/images/payroll-service/left-arrow.png"
          alt="Previous"
          class="arrow-img"
        />
      </button>

      <button
        class="nav-arrow next-arrow"
        id="nextBtn"
        title="Slide Selanjutnya"
      >
        <img
          src="assets/images/payroll-service/right-arrow.png"
          alt="Next"
          class="arrow-img"
        />
      </button>

      <!-- Main Slider Wrapper (6 Slide Gambar Full Screen) -->
      <main class="slider-wrapper">
        <!-- Slide 1 -->
        <section class="slide active" id="slide-1">
          <img
            src="assets/images/payroll-service/01.png"
            alt="Slide 1"
            class="full-img"
          />
        </section>

        <!-- Slide 2 -->
        <section class="slide" id="slide-2">
          <img
            src="assets/images/payroll-service/02.png"
            alt="Slide 2"
            class="full-img"
          />
        </section>

        <!-- Slide 3 -->
        <section class="slide" id="slide-3">
          <img
            src="assets/images/payroll-service/03.png"
            alt="Slide 3"
            class="full-img"
          />
        </section>

        <!-- Slide 4 -->
        <section class="slide" id="slide-4">
          <img
            src="assets/images/payroll-service/04.png"
            alt="Slide 4"
            class="full-img"
          />
        </section>

        <!-- Slide 5 -->
        <section class="slide" id="slide-5">
          <img
            src="assets/images/payroll-service/05.png"
            alt="Slide 5"
            class="full-img"
          />
        </section>

        <!-- Slide 6 -->
        <section class="slide" id="slide-6">
          <img
            src="assets/images/payroll-service/06.png"
            alt="Slide 6"
            class="full-img"
          />
        </section>
      </main>
    </div>

    <!-- JavaScript -->
    <script src="assets/js/payroll-service-2.js"></script>
  </body>
</html>
