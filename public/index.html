<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mekari Talenta - Payroll Disbursement</title>
    <link rel="stylesheet" href="assets/css/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="hero-container">
      <!-- Header -->
      <header class="header">
        <img
          src="assets/images/logo-mekari-talenta.svg"
          alt="Logo Mekari Talenta"
          class="logo-img"
        />

        <button class="home-btn" id="homeBtn" title="Kembali ke Beranda">
          <img src="assets/images/home.svg" alt="Home Icon" class="home-icon" />
        </button>
      </header>

      <button
        class="nav-arrow prev-arrow"
        id="prevBtn"
        title="Slide Sebelumnya"
      >
        <img src="assets/images/left.png" alt="Previous" class="arrow-img" />
      </button>

      <button
        class="nav-arrow next-arrow"
        id="nextBtn"
        title="Slide Selanjutnya"
      >
        <img src="assets/images/right.png" alt="Next" class="arrow-img" />
      </button>

      <!-- Container Slider Utama -->
      <main class="slider-wrapper">
        <!-- SLIDE 1 (Beranda) -->
        <section class="slide active" id="slide-1">
          <div class="left-section">
            <h1 class="title">
              Process <br />employee payroll
              <!-- Disbursement -->
            </h1>
            <button class="btn-payroll" id="runPayrollBtn">Run payroll</button>
          </div>

          <div class="right-section">
            <div class="hero-image">
              <img src="assets/images/hero.png" alt="Hero" />
            </div>
          </div>
        </section>

        <!-- SLIDE 6: Payroll Disbursement -->
        <section class="slide" id="slide-6">
          <!-- Video Hero Background -->
          <div class="disbursement-hero">
            <video autoplay muted loop playsinline>
              <source
                src="assets/images/Payroll-Disbursement.mp4"
                type="video/mp4"
              />
            </video>
          </div>
        </section>

        <section class="slide" id="slide-11">
          <div class="slide11-container">
            <img
              src="assets/images/done-icon.png"
              alt="Done"
              class="done-img"
            />
          </div>

          <h1 class="slide-caption">Payroll done!</h1>

          <button class="btn-reset" id="resetBtn">Back to home</button>
        </section>
      </main>

      <!-- Footer -->
      <footer class="footer">
        <a href="payroll-service-2.html" class="footer-link">
          <img
            src="assets/images/right-arrow.png"
            alt="Arrow Right"
            class="footer-icon"
          />
          Go To Payroll Service
        </a>
      </footer>
    </div>

    <!-- JavaScript -->
    <script src="assets/js/main.js"></script>
  </body>
</html>
